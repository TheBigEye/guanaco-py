name: Test Distribution Automation

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Keep check_os as the existing required-check label. For the Linux/Python
    # 3.9 row the actual runner is pinned to 24.04 because ubuntu-latest moved
    # to 26.04, which no longer has Python 3.9 in actions/setup-python's manifest.
    name: tests (${{ matrix.check_os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_os: ubuntu-latest
            runner: ubuntu-24.04
            python: "3.9"
          - check_os: ubuntu-latest
            runner: ubuntu-latest
            python: "3.13"
          - check_os: ubuntu-latest
            runner: ubuntu-latest
            python: "3.14"
          - check_os: windows-latest
            runner: windows-latest
            python: "3.9"
          - check_os: windows-latest
            runner: windows-latest
            python: "3.13"
          - check_os: windows-latest
            runner: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check guanaco docker tests
          python -m ruff format --check guanaco docker tests
      - name: Test policy, archives, wheels, publication and workflow contracts
        run: python -m pytest -q --cov=guanaco --cov=docker --cov-report=term-missing --cov-fail-under=85
      - run: python -m compileall -q guanaco docker
      - run: git diff --check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
