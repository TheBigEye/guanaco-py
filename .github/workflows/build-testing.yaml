name: Test Distribution Automation

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .github/scripts docker tests
          python -m ruff format --check .github/scripts docker tests
      - name: Test policy, archives, wheels, publication and workflow contracts
        run: python -m pytest -q --cov=.github/scripts --cov=docker --cov=docker/open_llama --cov-report=term-missing --cov-fail-under=85
      - run: python -m compileall -q .github/scripts docker
      - run: git diff --check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
