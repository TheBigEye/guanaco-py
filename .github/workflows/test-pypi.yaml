name: Tests for PyPI package

on:
  workflow_dispatch:

jobs:
  import-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Install guanaco-py from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "guanaco-py[all]"

      - name: Validate distribution and import
        shell: bash
        run: |
          python -c "import importlib.metadata as m; import llama_cpp; assert m.version('guanaco-py') == llama_cpp.__version__; print('guanaco-py', llama_cpp.__version__)"
