name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dev_version:
        description: Dev version N
        required: true

permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build and publish development source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Append development version
        shell: bash
        run: |
          current=$(sed -n 's/__version__ = "\([^"]*\)"/\1/p' llama_cpp/__init__.py)
          test -n "$current"
          new_version="${current}.dev${{ inputs.dev_version }}"
          sed -i "s/__version__ = \".*\"/__version__ = \"${new_version}\"/" llama_cpp/__init__.py

      - name: Build source distribution
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
