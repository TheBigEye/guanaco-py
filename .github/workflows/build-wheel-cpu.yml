name: Build CPU Wheels

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-cpu-x64:
    name: ${{ matrix.label }} · Py 3.9–3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            label: Linux x64 · manylinux_2_34
            cibw_archs: x86_64
            cibw_build: >-
              cp39-manylinux_x86_64 cp310-manylinux_x86_64
              cp311-manylinux_x86_64 cp312-manylinux_x86_64
              cp313-manylinux_x86_64 cp314-manylinux_x86_64
          - os: windows-latest
            platform: windows-x64
            label: Windows x64 · AMD64
            cibw_archs: AMD64
            cibw_build: >-
              cp39-win_amd64 cp310-win_amd64 cp311-win_amd64
              cp312-win_amd64 cp313-win_amd64 cp314-win_amd64

    steps:
      - name: Checkout Guanaco and llama.cpp
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and validate CPU wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_VERBOSITY: 1

          # llama.cpp now uses C++ symbols newer than the manylinux_2_28
          # policy permits. AlmaLinux 9's system GCC 11 matches the
          # manylinux_2_34 GLIBCXX/CXXABI policy, unlike the image's GCC 14.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y gcc gcc-c++ &&
            /usr/bin/g++ --version
          CIBW_ENVIRONMENT_LINUX: >-
            CC=/usr/bin/gcc CXX=/usr/bin/g++
            CMAKE_ARGS="-DGGML_CUDA=OFF -DGGML_METAL=OFF
            -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_NATIVE=OFF
            -DGGML_BACKEND_DL=OFF -DGGML_CPU_ALL_VARIANTS=OFF
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF
            -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF"
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="-DGGML_CUDA=OFF -DGGML_METAL=OFF
            -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_NATIVE=OFF
            -DGGML_BACKEND_DL=OFF -DGGML_CPU_ALL_VARIANTS=OFF
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF
            -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF"

          # Show the exact ABI analysis before repair so future policy
          # failures identify their required symbols in the Actions log.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel show {wheel} &&
            auditwheel repair --plat manylinux_2_34_x86_64
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; import llama_cpp;
            assert m.version('guanaco-py') == llama_cpp.__version__;
            print('guanaco-py', llama_cpp.__version__, 'CPU x64 wheel OK')"

      - name: Upload CPU x64 wheels
        uses: actions/upload-artifact@v7
        with:
          name: guanaco-py-cpu-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
