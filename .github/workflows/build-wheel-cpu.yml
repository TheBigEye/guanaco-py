name: Build CPU Wheels

on:
  workflow_call:
    inputs:
      version:
        description: Upstream X.Y.Z prepared by the release workflow
        required: true
        type: string
      channel:
        description: cpu (portable) or avx2 (fixed SIMD target)
        type: string
        default: cpu

permissions:
  contents: read

jobs:
  config:
    name: Select systems from the prepared manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: guanaco-source
          path: work/prepared
      - name: Resolve the CPU platform matrix (both systems for releases)
        id: config
        run: python -m guanaco configure matrix --manifest work/prepared/build-manifest.json

  build:
    needs: config
    name: ${{ inputs.channel }} · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    env:
      BUILD_CHANNEL: ${{ inputs.channel }}
      WHEEL_PLATFORM: ${{ matrix.platform }}
      EXPECTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download the prepared source snapshot
        uses: actions/download-artifact@v8
        with:
          name: guanaco-source
          path: work/prepared

      - name: Verify and unpack source
        run: python -m guanaco unpack-source work/prepared work/source --version "$EXPECTED_VERSION"

      - name: Resolve frozen Python matrix and CPU flags
        id: config
        run: >-
          python -m guanaco configure cpu
          --manifest work/prepared/build-manifest.json
          --channel "$BUILD_CHANNEL" --platform "$WHEEL_PLATFORM"
          --version "$EXPECTED_VERSION"

      - name: Build, repair and smoke-test wheels
        id: build
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: work/source
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ steps.config.outputs.build }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_VERBOSITY: 1
          # AlmaLinux 9's GCC 11 matches the manylinux_2_34 GLIBCXX policy;
          # the container's newer default compiler can exceed that policy.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: dnf install -y gcc gcc-c++ && /usr/bin/g++ --version
          CIBW_ENVIRONMENT_LINUX: ${{ steps.config.outputs.cibw_environment }}
          CIBW_ENVIRONMENT_WINDOWS: ${{ steps.config.outputs.cibw_environment }}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel show {wheel} &&
            auditwheel repair --only-plat --plat manylinux_2_34_x86_64 -w {dest_dir} {wheel}
          # The name is interpolated by Actions, not by the shell:
          # cibuildwheel runs this inside the manylinux container, where
          # this step's own environment variables are not available.
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; import llama_cpp;
            assert m.version('${{ steps.config.outputs.package }}') == llama_cpp.__version__;
            print(llama_cpp.llama_print_system_info().decode())"

      - name: Validate the selected Python matrix, file integrity and bindings
        id: verify
        env:
          ARTIFACT: ${{ steps.config.outputs.artifact }}
        run: >-
          python -m guanaco verify-wheels
          --manifest work/prepared/build-manifest.json --directory wheelhouse
          --channel "$BUILD_CHANNEL" --platform "$WHEEL_PLATFORM"
          --receipt "work/receipts/$ARTIFACT.json"

      - name: Inspect test wheel contents, including failed/partial builds
        if: ${{ !cancelled() && steps.config.outputs.test_only == 'true' && steps.build.outcome != 'skipped' }}
        env:
          VERIFICATION: ${{ steps.verify.outcome || 'skipped' }}
        run: >-
          python -m guanaco inspect wheels
          --manifest work/prepared/build-manifest.json --directory wheelhouse
          --channel "$BUILD_CHANNEL" --platform "$WHEEL_PLATFORM"
          --verification "$VERIFICATION" --output work/wheel-inspection

      - name: Upload wheel binaries
        if: ${{ !cancelled() && (success() || steps.config.outputs.test_only == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: ${{ steps.config.outputs.test_only == 'true' && 'warn' || 'error' }}
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Upload the small validation receipt
        uses: actions/upload-artifact@v7
        with:
          name: receipt-${{ steps.config.outputs.artifact }}
          path: work/receipts/*.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload test wheel inspection
        if: ${{ !cancelled() && steps.config.outputs.test_only == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: inspection-${{ steps.config.outputs.artifact }}
          path: work/wheel-inspection/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
