name: Build Release and Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guanaco-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read guanaco-py version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          value=$(sed -n 's/__version__ = "\([^"]*\)"/\1/p' llama_cpp/__init__.py)
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build-cpu-wheels:
    needs: version
    uses: ./.github/workflows/build-wheel-cpu.yml

  build-cuda-wheels:
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml

  release-cpu:
    name: Release · CPU x64 wheels
    needs: [version, build-cpu-wheels]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cpu-*
          path: dist
          merge-multiple: true
      - name: Create or update CPU release
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "guanaco-py ${VERSION} (CPU)" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  release-cuda:
    name: Release · ${{ matrix.cuda }} x64 wheels
    needs: [version, build-cuda-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu121, cu122, cu123, cu124, cu126, cu128, cu131]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cuda-*-${{ matrix.cuda }}-*
          path: dist
          merge-multiple: true
      - name: Create or update CUDA release
        shell: bash
        run: |
          tag="v${VERSION}-${{ matrix.cuda }}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "guanaco-py ${VERSION} (${{ matrix.cuda }})" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  pages-index:
    name: Pages · styled PEP 503 wheel index
    needs: [release-cpu, release-cuda]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout index generator
        uses: actions/checkout@v6

      - name: Read GitHub release assets
        run: gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json

      - name: Generate styled PEP 503 indexes
        run: python .github/scripts/generate-wheel-index.py releases.json site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload wheel index site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
