name: Build Release and Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guanaco-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read guanaco-py version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          value=$(sed -n 's/__version__ = "\([^"]*\)"/\1/p' llama_cpp/__init__.py)
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  cpu:
    name: CPU (portable)
    needs: version
    uses: ./.github/workflows/build-wheel-cpu.yml

  avx2:
    name: CPU · AVX2
    needs: version
    uses: ./.github/workflows/build-wheel-avx2.yml

  cuda-121:
    name: CUDA 12.1
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu121

  cuda-122:
    name: CUDA 12.2
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu122

  cuda-123:
    name: CUDA 12.3
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu123

  cuda-124:
    name: CUDA 12.4
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu124

  cuda-126:
    name: CUDA 12.6
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu126

  cuda-128:
    name: CUDA 12.8
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu128

  cuda-131:
    name: CUDA 13.1
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml
    with:
      cuda: cu131

  release-cpu:
    name: Release · CPU
    needs: [version, cpu]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cpu-*
          path: dist
          merge-multiple: true
      - name: Create or update CPU release
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "v${VERSION}" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  release-avx2:
    name: Release · CPU AVX2
    needs: [version, avx2]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-avx2-*
          path: dist
          merge-multiple: true
      - name: Create or update AVX2 release
        shell: bash
        run: |
          tag="v${VERSION}-avx2"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "v${VERSION}-avx2" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  release-cuda:
    name: Release · ${{ matrix.cuda }}
    needs: [version, cuda-121, cuda-122, cuda-123, cuda-124, cuda-126, cuda-128, cuda-131]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu121, cu122, cu123, cu124, cu126, cu128, cu131]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cuda-*-${{ matrix.cuda }}-*
          path: dist
          merge-multiple: true
      - name: Create or update CUDA release
        shell: bash
        run: |
          tag="v${VERSION}-${{ matrix.cuda }}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "v${VERSION}-${{ matrix.cuda }}" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  pages-index:
    name: Pages · PEP 503
    needs: [release-cpu, release-avx2, release-cuda]
    uses: ./.github/workflows/deploy-pages.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
