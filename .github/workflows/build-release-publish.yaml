name: Build and Publish Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guanaco-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          value=$(sed -n 's/__version__ = "\([^"]*\)"/\1/p' llama_cpp/__init__.py)
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  cpu:
    needs: version
    uses: ./.github/workflows/build-wheel-cpu.yml

  cuda:
    needs: version
    uses: ./.github/workflows/build-wheels-cuda.yaml

  release-cpu:
    name: Publish CPU release
    needs: [version, cpu]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cpu-*
          path: dist
          merge-multiple: true
      - name: Create or update CPU release
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "guanaco-py ${VERSION} (CPU)" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  release-cuda:
    name: Publish ${{ matrix.cuda }} release
    needs: [version, cuda]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu121, cu122, cu123, cu124, cu126, cu128, cu131]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: guanaco-py-cuda-*-${{ matrix.cuda }}-*
          path: dist
          merge-multiple: true
      - name: Create or update CUDA release
        shell: bash
        run: |
          tag="v${VERSION}-${{ matrix.cuda }}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "guanaco-py ${VERSION} (${{ matrix.cuda }})" --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  pages-index:
    name: Publish PEP 503 wheel indexes
    needs: [release-cpu, release-cuda]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read release assets
        run: gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
      - name: Generate CPU and CUDA indexes
        shell: python
        run: |
          import html, json, pathlib, re
          releases = [r for page in json.load(open("releases.json")) for r in page]
          channels = {"cpu": []}
          for release in releases:
              tag = release["tag_name"]
              match = re.search(r"-(cu\d+)$", tag)
              channel = match.group(1) if match else "cpu"
              for asset in release.get("assets", []):
                  if asset["name"].endswith(".whl") and "guanaco_py" in asset["name"]:
                      channels.setdefault(channel, []).append((asset["name"], asset["browser_download_url"]))
          root = pathlib.Path("site/whl")
          for channel, assets in channels.items():
              package = root / channel / "guanaco-py"
              package.mkdir(parents=True, exist_ok=True)
              (root / channel / "index.html").write_text(
                  '<!doctype html><a href="guanaco-py/">guanaco-py</a>\n', encoding="utf-8")
              links = [f'<a href="{html.escape(url)}">{html.escape(name)}</a><br>' for name, url in sorted(set(assets))]
              (package / "index.html").write_text('<!doctype html>\n' + '\n'.join(links) + '\n', encoding="utf-8")
          (root / "index.html").write_text('<!doctype html>\n' + '\n'.join(
              f'<a href="{html.escape(channel)}/">{html.escape(channel)}</a><br>' for channel in sorted(channels)) + '\n', encoding="utf-8")
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
