name: CUDA Builds

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: CUDA version
        required: true
        type: choice
        options: [cu121, cu122, cu123, cu124, cu126, cu128, cu131]
  workflow_call:
    inputs:
      cuda:
        description: CUDA channel to build
        required: true
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  config:
    name: Config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cuda.outputs.version }}
      short: ${{ steps.cuda.outputs.short }}
      arch: ${{ steps.cuda.outputs.arch }}
      legacy_msvc: ${{ steps.cuda.outputs.legacy_msvc }}
    steps:
      - name: Resolve CUDA settings
        id: cuda
        shell: bash
        run: |
          case "${{ inputs.cuda }}" in
            cu121) version="12.1.1"; arch="75;80;86;89;90"; legacy_msvc="true" ;;
            cu122) version="12.2.2"; arch="75;80;86;89;90"; legacy_msvc="true" ;;
            cu123) version="12.3.2"; arch="75;80;86;89;90"; legacy_msvc="true" ;;
            cu124) version="12.4.1"; arch="75;80;86;89;90"; legacy_msvc="false" ;;
            cu126) version="12.6.3"; arch="75;80;86;89;90"; legacy_msvc="false" ;;
            cu128) version="12.8.1"; arch="75;80;86;89;90;100;120"; legacy_msvc="false" ;;
            cu131) version="13.1.0"; arch="75;80;86;89;90;100;120"; legacy_msvc="false" ;;
            *) echo "Unsupported CUDA channel: ${{ inputs.cuda }}" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${{ inputs.cuda }}" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "legacy_msvc=$legacy_msvc" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux · Py ${{ matrix.python }}
    needs: config
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ needs.config.outputs.version }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git libssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          $HOME/.local/bin/uv python install ${{ matrix.python }}
          $HOME/.local/bin/uv venv --python ${{ matrix.python }} .venv
          $HOME/.local/bin/uv pip install --python .venv/bin/python build

      - name: Show toolchain
        run: |
          .venv/bin/python --version
          nvcc --version

      - name: Build
        env:
          CMAKE_ARGS: >-
            -DGGML_CUDA=ON
            -DCMAKE_CUDA_ARCHITECTURES=${{ needs.config.outputs.arch }}
            -DGGML_CUDA_FORCE_MMQ=OFF
            -DGGML_NATIVE=OFF
            -DLLAMA_BUILD_EXAMPLES=OFF
            -DLLAMA_BUILD_TESTS=OFF
            -DLLAMA_BUILD_SERVER=OFF
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs -lcuda"
        run: .venv/bin/python -m build --wheel

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: guanaco-py-cuda-linux-x64-${{ needs.config.outputs.short }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows · Py ${{ matrix.python }}
    needs: config
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Install CUDA ${{ needs.config.outputs.version }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ needs.config.outputs.version }}
          method: network
          use-github-cache: false

      - name: Set up MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo PATH=%PATH%>>%GITHUB_ENV%
          echo INCLUDE=%INCLUDE%>>%GITHUB_ENV%
          echo LIB=%LIB%>>%GITHUB_ENV%
          echo LIBPATH=%LIBPATH%>>%GITHUB_ENV%

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip build ninja

      - name: Show toolchain
        shell: pwsh
        run: |
          python --version
          nvcc --version

      - name: Build
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          if ('${{ needs.config.outputs.legacy_msvc }}' -eq 'true') {
            $legacyFlags = '--allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH'
            $env:CUDAFLAGS = $legacyFlags
            Write-Host "Using legacy CUDA/MSVC flags: $legacyFlags"
          } else {
            Remove-Item Env:CUDAFLAGS -ErrorAction SilentlyContinue
          }

          $env:CMAKE_ARGS = @(
            '-DGGML_CUDA=ON'
            '-DCMAKE_CUDA_ARCHITECTURES=${{ needs.config.outputs.arch }}'
            '-DGGML_CUDA_FORCE_MMQ=OFF'
            '-DGGML_NATIVE=OFF'
            '-DLLAMA_BUILD_EXAMPLES=OFF'
            '-DLLAMA_BUILD_TESTS=OFF'
            '-DLLAMA_BUILD_SERVER=OFF'
          ) -join ' '
          python -m build --wheel

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: guanaco-py-cuda-windows-x64-${{ needs.config.outputs.short }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
