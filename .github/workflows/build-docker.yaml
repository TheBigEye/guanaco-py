name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published Guanaco/upstream X.Y.Z"
        type: string
        required: true
      promote_latest:
        description: "Also update the latest image tag"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      promote_latest:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: guanaco-docker
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version and resolve image tags
        id: image
        env:
          VERSION: ${{ inputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: python .github/scripts/configure_build.py docker
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build from the already published, checksummed CPU wheel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/simple/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            GUANACO_VERSION=${{ inputs.version }}
            GUANACO_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
