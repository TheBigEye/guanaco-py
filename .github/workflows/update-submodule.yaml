name: Update Submodule

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch"
        required: true
        type: string
      submodule_path:
        description: "Submodule path to update"
        required: true
        default: "vendor/llama.cpp"
        type: string

permissions:
  contents: write

concurrency:
  group: update-submodule
  cancel-in-progress: false

env:
  SUB: ${{ inputs.submodule_path }}
  REF: ${{ inputs.ref }}

jobs:
  update:
    name: Checkout ref + commit + push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check out the requested ref inside the submodule
        run: |
          set -euo pipefail

          # Fail fast with a clear error if the path is not a real submodule.
          git submodule status "$SUB" > /dev/null

          cd "$SUB"

          # Fast path: GitHub servers allow fetching any reachable commit by
          # its full SHA (the same mechanism actions/checkout uses), so we can
          # grab exactly what was asked for without cloning the full history.
          if git fetch --no-tags --depth=1 origin "$REF"; then
            git checkout --detach FETCH_HEAD
          else
            # Fallback (e.g. short SHAs): hydrate the submodule history and
            # resolve the ref like normal git would.
            echo "::notice::Direct fetch of '$REF' failed; fetching the full remote state instead."
            git fetch --no-tags --unshallow origin || git fetch --no-tags origin
            git checkout --detach "$REF" || git checkout --detach "origin/$REF"
          fi

      - name: Commit the new submodule pointer
        run: |
          set -euo pipefail

          OLD="$(git rev-parse "HEAD:$SUB")"
          NEW="$(git -C "$SUB" rev-parse HEAD)"

          if [ "$OLD" = "$NEW" ]; then
            echo "::notice title=Nothing to do::$SUB is already at ${NEW:0:7} — no commit created."
            exit 0
          fi

          OLD_SHORT="$(git -C "$SUB" rev-parse --short=7 "$OLD")"
          NEW_SHORT="$(git -C "$SUB" rev-parse --short=7 "$NEW")"
          MSG="Update Submodule $SUB ${OLD_SHORT}..${NEW_SHORT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUB"
          git commit -m "$MSG"

          UPSTREAM_URL="$(git config --file .gitmodules "submodule.$SUB.url" || true)"
          UPSTREAM_URL="${UPSTREAM_URL%.git}"
          {
            echo "### Submodule updated :rocket:"
            echo "- **Path:** \`$SUB\`"
            echo "- **Before:** \`$OLD\`"
            echo "- **After:** \`$NEW\`"
            echo "- **Commit message:** \`$MSG\`"
            [ -n "$UPSTREAM_URL" ] && echo "- **Upstream compare:** $UPSTREAM_URL/compare/$OLD...$NEW"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to the dispatched branch
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
