[build-system]
requires = ["scikit-build-core[pyproject]>=0.9.2"]
build-backend = "scikit_build_core.build"

[project]
name = "guanaco-py"
dynamic = ["version"]
description = "Efficient Python bindings for llama.cpp, maintained as guanaco-py"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrei Betlen", email = "abetlen@gmail.com" },
    { name = "JamePeng", email = "jame_peng@sina.com" },
]
maintainers = [
    { name = "Green", email = "thebigeyedev@gmail.com" },
]
dependencies = [
    "typing-extensions>=4.8.0",
    "numpy>=1.21.6,<=2.3.2",
    "diskcache>=5.6.2",
    "jinja2>=3.1.0",
    "Pillow>=9.5.0",
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


[project.optional-dependencies]
server = [
    "uvicorn>=0.22.0",
    "fastapi>=0.100.0",
    "pydantic-settings>=2.0.1",
    "sse-starlette>=1.6.1",
    "starlette-context>=0.3.6,<0.6",
    "PyYAML>=5.1",
]
test = [
    "pytest>=7.4.0",
    "httpx>=0.24.1",
    "scipy>=1.10",
    "fastapi>=0.100.0",
    "sse-starlette>=1.6.1",
    "starlette-context>=0.3.6,<0.6",
    "pydantic-settings>=2.0.1",
    "huggingface-hub>=0.23.0"
]

all = [
    "guanaco-py[server,test]",
]

[tool.scikit-build]
wheel.packages = ["llama_cpp"]
cmake.verbose = true
cmake.minimum-version = "3.21"
minimum-version = "0.5.1"
sdist.include = [".git", "vendor/llama.cpp/*"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "llama_cpp/__init__.py"

[project.urls]
Homepage = "https://github.com/TheBigEye/guanaco-py"
Issues = "https://github.com/TheBigEye/guanaco-py/issues"
Documentation = "https://github.com/TheBigEye/guanaco-py/tree/main/docs/wiki"
Changelog = "https://github.com/TheBigEye/guanaco-py/blob/main/CHANGELOG.md"
"Upstream changes" = "https://github.com/JamePeng/llama-cpp-python"
"Original project" = "https://github.com/abetlen/llama-cpp-python"

[tool.pytest.ini_options]
testpaths = "tests"
